<!doctype html>
<html lang="">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>TuDouLog</title>
    <link rel="icon" href="/img/tudou.png" type="image/png" />
    <script>
      // 首屏渲染前确定色彩模式，避免深色用户看到白屏闪烁
      ;(function () {
        var mode = 'auto'
        try {
          mode = localStorage.getItem('colorMode') || 'auto'
        } catch (e) {}
        var dark =
          mode === 'dark' ||
          (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-color-scheme', dark ? 'dark' : 'light')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script src="/src/main.ts" type="module"></script>
  </body>
</html>
