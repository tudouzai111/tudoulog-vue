name: Deploy to GitHub Pages

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

# 允许 GITHUB_TOKEN 写入仓库内容
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9   # 指定 pnpm 版本

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'   # 缓存 pnpm 的 store，加速安装

      - name: Install dependencies
        run: pnpm install --frozen-lockfile  # 相当于 npm ci，严格按照 pnpm-lock.yaml 安装

      - name: Build
        run: pnpm run build   # 构建命令

      # 仅 GitHub Pages 需要：404.html 与 index.html 一致，
      # 让 /article/xxx 深链接在 gh-pages 上也能被 SPA 接管。
      # （Cloudflare Pages 的构建不能带 404.html，否则深链接会变成 404 状态码）
      - name: Create SPA fallback 404.html
        run: cp dist/index.html dist/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
